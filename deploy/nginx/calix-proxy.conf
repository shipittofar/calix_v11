# Proxy settings for the CALIX website, included inside the HTTPS `server` block
# (deploy/nginx/calix.conf.example). Used unchanged by the local production-like test.
# See docs/admin-panel-runbook.md §3.

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # Server Actions compare the Origin header with the host, port included: pass the Host
    # header through exactly as the browser sent it ($host would drop a non-default port).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The visitor's address. Nginx overwrites anything the client sent, so the app can trust
    # it (TRUSTED_PROXY_HEADER=x-real-ip). X-Forwarded-For is replaced, not appended to, so a
    # client-supplied value never reaches the app.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Never cache responses here: pages change when settings are saved, and admin pages are
    # private. Next.js sends the right Cache-Control headers for browsers.
    proxy_cache off;
    proxy_buffering on;

    # An enquiry is answered within about 16 s, even when a channel times out.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    client_max_body_size 1m;
}
